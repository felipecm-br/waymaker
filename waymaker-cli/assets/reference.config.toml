# ==============================================================================
# WAYMAKER — COMPLETE REFERENCE CONFIGURATION FILE
# ==============================================================================
# This file documents EVERY configuration section, table, key, and possibility
# available in Waymaker, with descriptions, supported types, allowed enum variants,
# and default values in English.
#
# Reference preset: `waymaker-cli/assets/presets/jump.toml`
# ==============================================================================

# ==============================================================================
# 1. TUI & TERMINAL ([tui])
# ==============================================================================
[tui]
# Height of the TUI as a percentage of the terminal window (1 to 100).
# When set, runs in inline/overlay mode. Omit or comment out for fullscreen mode.
# Values: 1 to 100 | Default: fullscreen (None)
# percentage = 60

# Minimum row height for inline mode.
# Values: integers >= 1 | Default: 10
# min = 10

# Maximum row height for inline mode.
# Values: integers >= 1 | Default: 120
# max = 120

# Restores the original terminal screen buffer upon exiting.
# Values: true, false | Default: true
restore_fullscreen = true

# Automatically redraws the interface when the terminal window is resized.
# Values: true, false | Default: false
redraw_on_resize = false

# Enables Kitty Keyboard Protocol (disambiguates Escape, Shift-Space, chords, etc.).
# Values: true, false | Default: true
extended_keys = true

# Delay in milliseconds before redrawing after screen transitions.
# Values: integer (ms) | Default: 100
sleep_ms = 100

# Clears the TUI screen after a selection is made.
# Values: true, false | Default: true
clear_on_exit = true

# Clears the screen after executing external terminal commands.
# Values: true, false | Default: true
clear_after_execute = true

# Uses the ANSI OSC 52 escape sequence for clipboard copy operations.
# When false, falls back to CLIPcmd defined under [envs].
# Values: true, false | Default: true
osc52 = true

# Enables terminal mouse event capture (clicks, scroll wheel, drag resizing).
# Values: true, false | Default: true
mouse = true

# Strips trailing newline (\n) from copied text when copying items.
# Values: true, false | Default: false
copy_trailing_newline = false

# Terminal output stream used by the renderer.
# Values: "Stdout", "BufferedStderr" | Default: "Stdout"
stream = "Stdout"


# ==============================================================================
# 2. GLOBAL UI & NAVIGATION ([ui])
# ==============================================================================
[ui]
# Refresh rate of the event loop and UI renderer in frames per second (FPS / ticks).
# Values: integers >= 1 | Default: 15
tick_rate = 60

# Optional global default sort order for lists when no specific folder rule applies.
# Values: "Natural", "Alphabetical", "AlphabeticalReverse", "Modified",
#         "ModifiedReverse", "Created", "CreatedReverse", "Size", "SizeReverse", "Extension"
# Default: None (natural input order)
# default_sort = "Natural"

# Outer border styling for the entire container.
[ui.border]
# Border style: "Rounded", "Plain", "Double", "Thick", "None" | Default: "None"
# type = "Rounded"
# Border color: "Black", "Red", "Green", "Yellow", "Blue", "Magenta", "Cyan", "Gray",
#               "Darkgray", "Lightred", "Lightgreen", "Lightyellow", "Lightblue",
#               "Lightmagenta", "Lightcyan", "White", or hex "#RRGGBB"
# color = "Darkgray"

# Interactive sort menu grid displayed in the footer.
[ui.sort_menu]
# Number of columns for the sort options grid. Set to 0 or 1 for single-line display.
# Values: integers >= 0 | Default: 4
columns = 4
# Whether to display the "Sort:" title prefix.
# Values: true, false | Default: true
show_title = true

# 3-Pane Miller Columns / Parent Directory Peek layout.
[ui.parent_peek]
# Enables the left pane displaying the parent directory contents.
# Values: true, false | Default: false
enabled = false

# Width percentage of the parent peek pane relative to total terminal width.
# Values: 1 to 100 | Default: 15
pct = 15

# Maximum row height for the parent peek pane.
# Values: integer or None | Default: None
# max = 20

# Title color for the parent folder header.
# Values: color name or hex "#RRGGBB" | Default: "Cyan"
parent_color = "Cyan"

# Highlights the current working directory inside the parent directory list.
# Values: true, false | Default: true
highlight = true

# Color for highlighting the current directory inside the parent list.
# Values: color name or hex "#RRGGBB" | Default: "Yellow"
highlight_color = "Yellow"

# Border configuration for the Parent Peek left pane.
[ui.parent_peek.border]
# Shows the vertical border line separating parent peek from results.
# Values: true, false | Default: true
show = true
# Border line color.
# Values: color name or hex "#RRGGBB" | Default: "DarkGray"
color = "DarkGray"
# Border line type: "Plain", "Rounded", "Double", "Thick" | Default: "Plain"
type = "Plain"

# Navigation Mode (Vim modal navigation / file manager traversal).
[ui.nav]
# Enables navigation mode: allows switching focus between search filter and results list.
# Values: true, false | Default: false
active = true

# Navigation profile:
# - "list": Safe picker navigation (cursor movement, paging, selection, filter toggle).
# - "basic": Minimal vertical navigation (j/k, gg/G, J/K, esc, q). Hopping disabled.
# - "fm": Full file manager (directory hopping h/l, frecency, bookmarks, file ops).
# - "none": Zero injected defaults; strictly uses bindings defined in [ui.nav.binds].
# Values: "list", "basic", "fm", "none" | Default: "list"
profile = "fm"

# Initial keyboard focus when launching Waymaker:
# - "filter": Focus starts in the search query bar for immediate typing.
# - "picker": Focus starts on the results list (NavBar) for instant Vim home-row movement.
# Values: "filter", "picker" | Default: "filter"
focus_on_start = "picker"

# Visual indicator bar style on the focused item:
# Values: "Plain" (│), "Thick" (█), "Double" (║), "Rounded" (│),
#         "QuadrantOutside" (▌), "QuadrantInside" (▐), "None"
# Default: "Plain"
bar = "Plain"

# Color of the navigation indicator bar.
# Values: color name or hex "#RRGGBB" | Default: "Darkgray"
color = "Darkgray"

# Enables bold text for the navigation indicator.
# Values: true, false | Default: false
# bold = false

# Enables blinking for the navigation indicator bar.
# Values: true, false | Default: false
# blink = false

# Blink speed when blink = true.
# Values: "Slow", "Normal", "Rapid" | Default: "Normal"
# blink_rate = "Normal"

# Text marker prepended to the focused row when results have focus.
# Values: string (e.g. ">> ", "▶ ") | Default: ""
# marker = ""

# Prompt prefix text displayed when results have focus.
# Values: string | Default: ""
# prompt = ""

# Shows desktop/TUI notifications for file-manager clipboard actions (yank/cut/paste).
# Values: true, false | Default: false
notify = false

# When true, typing while results are focused falls through to the query input.
# Values: true, false | Default: false
passthrough = false

# Displays shortcut hints in the footer when the results pane is focused.
# Values: true, false | Default: true
hints = true

# Number of columns for the navigation hints grid in the footer.
# Values: integer >= 1 | Default: 4
hints_columns = 4

# Keybindings active when Navigation mode is enabled and the Results pane has focus.
[ui.nav.binds]
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"f"             = "@dirs"
"b"             = "@bookmarks"
"*"             = "@bookmark"
"/"             = "FocusFilter"
" "             = "Toggle"
"esc"           = "Quit"
"q"             = "Quit"
"j"             = "Down"
"k"             = "Up"
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"
"J"             = "PreviewDown(5)"
"K"             = "PreviewUp(5)"
"shift-j"       = "PreviewDown(5)"
"shift-k"       = "PreviewUp(5)"
"ctrl-shift-j"  = "PreviewDown(5)"
"ctrl-shift-k"  = "PreviewUp(5)"
"ctrl-shift-J"  = "PreviewDown(5)"
"ctrl-shift-K"  = "PreviewUp(5)"
"ctrl-d"        = "PreviewHalfPageDown"
"l"             = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"right"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"h"             = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"left"          = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"backspace"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]
"e"             = "Execute(nvim {+})"
"ctrl-e"        = "Execute(nvim {+})"
"y"             = "@yank"
"x"             = "@cut"
"p"             = "@paste"
"P"             = "@paste_into"
"ctrl-v"        = "@paste_into"
"u"             = "@undo"
"ctrl-r"        = "@redo"
"ctrl-p"        = "SwitchPreview"
","             = "SortMenu"
"\\"            = "ToggleParentPeek"


# ==============================================================================
# 3. QUERY / SEARCH INPUT BAR ([query])
# ==============================================================================
[query]
# Controls visibility of the search input bar.
# Values: true, false | Default: true
show = true

# Default search prompt symbol.
# Values: string (e.g. "> ", " ", "🔍 ") | Default: "> "
prompt = "> "

# Initial text populated in the query input bar on startup.
# Values: string | Default: ""
initial = ""

# Hardware cursor style in the query input bar:
# - "default": Standard terminal cursor.
# - "none": Hides hardware cursor to avoid shader flicker in GPU terminals (Ghostty/Kitty).
# Values: "default", "none" | Default: "default"
cursor = "default"

# Maintains horizontal scroll padding when navigating query text.
# Values: true, false | Default: true
scroll_padding = true

# Displays match count status (e.g. "12/150") right-aligned inside the search bar.
# Values: true, false | Default: false
status_inline = true

# Underline separator drawn directly underneath the query row (zero extra line overhead).
# Values: true, false | Default: false
underline = true

# Styling for the standard prompt symbol.
[query.prompt_style]
fg = "cyan"
modifier = "BOLD"

# Styling for the typed search query text.
[query.style]
# fg = "white"
# bg = "reset"
# modifier = "none"

# Styling for the query underline separator.
[query.underline_style]
fg = "#8999f1"

# Border around the search bar.
[query.border]
# type = "Rounded"
# color = "Cyan"

# Mode-specific styling when search filter is active and focused.
[query.filter]
prompt = "> "
prompt_style.fg = "blue"
prompt_style.modifier = "BOLD"
underline = true
underline_style.fg = "#8999f1"

# Data source index 0 (local files) prompt and styling.
[query.local]
prompt = "> "
prompt_style.fg = "cyan"
underline_style.fg = "cyan"

# Data source index 1 (frecency history) prompt and styling.
[query.frecency]
prompt = "󱅤 "
prompt_style.fg = "#8999f1"
underline_style.fg = "#8999f1"

# Data source index 2 (bookmarks / pinned) prompt and styling.
[query.bookmarks]
prompt = " "
prompt_style.fg = "#f9e2af"
underline_style.fg = "#f9e2af"


# ==============================================================================
# 4. RESULTS TABLE ([results])
# ==============================================================================
[results]
# Maximum visible rows in the results list.
# Values: integers >= 1, or None (fills available space) | Default: None
max = 15

# Displays results in reverse order (bottom-to-top).
# Values: true, false | Default: false
reverse = false

# Enables circular wrap-around navigation when scrolling past top/bottom bounds.
# Values: true, false | Default: false
scroll_wrap = true

# Number of rows maintained as padding above and below the cursor when scrolling.
# Values: integers >= 0 | Default: 2
scroll_padding = 2

# Initial cursor row position (0-indexed, or negative for from-the-end, e.g. -1).
# Values: integer | Default: None (starts at 0)
# pos = 0

# Enables multi-item selection with Tab / Toggle.
# Values: true, false | Default: true
multi = true

# Prefix marker rendered on multi-selected rows.
# Values: string | Default: "▌ "
multi_prefix = "▌ "

# Prefix rendered on unselected rows.
# Values: string | Default: "  "
unselected_prefix = "  "

# Default prefix for normal rows.
# Values: string | Default: ""
default_prefix = ""

# Prefix marker for the row currently under the cursor.
# Values: string | Default: ""
current_prefix = ""

# Prefix character that activates the animated spinner on an item.
# Values: string | Default: ""
spinner_prefix = ""

# Animated spinner style:
# Values: "dot", "line", "jump", "pulse", "points", "meter", "hamburger",
#         "ellipsis", "globe", "moon", "monkey", "arc", "nerd", "nerdarc", "minidot"
# Default: "dot"
spinner = "dot"

# Inlines the spinner inside text rather than placing it in the prefix column.
# Values: true, false | Default: false
spinner_inline = false

# Wraps long result text onto multiple lines.
# Values: true, false | Default: false
wrap = false

# Minimum width in characters for each column.
# Values: integers >= 1 | Default: 2
min_width = 2

# Character spacing between columns.
# Values: integers >= 0 | Default: 1
column_spacing = 1

# Right-aligns the final column to the edge of the window.
# Values: true, false | Default: false
right_align_last = false

# Stacks columns vertically rather than side-by-side.
# Values: true, false | Default: false
stacked_columns = false

# Horizontal row connection style for the selection highlight across columns:
# - "Full": Selection highlight covers the entire row uniformly.
# - "Capped": Inactive style across row, active style on active column.
# - "Disjoint": Styles applied independently per column.
# Values: "Full", "Capped", "Disjoint" | Default: "Capped"
row_connection = "Full"

# Prepend file-type Nerd Font icons before filenames.
# Requires a Nerd Font installed in your terminal.
# Values: true, false | Default: false
icons = true

# When true, the icon on the cursor row inherits the cursor text color (Yazi-style).
# Values: true, false | Default: false
uncolor_current_icon = true

# When true, inverts the icon color on the cursor row (Blue<->Yellow, Red<->Cyan).
# Values: true, false | Default: false
invert_current_icon = false

# Border thickness / glyph style for the navigation bar on the cursor row:
# Values: "Plain" (│), "Thick" (█), "Double" (║), "Rounded" (│),
#         "QuadrantOutside" (▌), "QuadrantInside" (▐), "None"
# Default: None (inherits ui.nav.bar)
current_nav_bar = "Plain"

# Style for the navigation bar glyph cell on the cursor row.
[results.current_nav_bar_style]
fg = "white"
# bg = "Darkgray"
# modifier = "BOLD"

# Highlight styling for the cursor row.
[results.current_style]
fg = "black"
bg = "Darkgray"
modifier = "BOLD"

# Styling for characters matching the search query.
[results.match_style]
fg = "green"
modifier = "ITALIC"

# Default styling for items.
[results.style]
# fg = "white"

# Styling for multi-selected rows.
[results.selected_style]
modifier = "BOLD"

# Styling for the prefix marker of multi-selected rows.
[results.selected_prefix_style]
fg = "cyan"
modifier = "BOLD"

# Styling for the prefix marker of yanked rows (FM mode).
[results.yank_prefix_style]
fg = "yellow"
modifier = "BOLD"

# Styling for the prefix marker of cut rows (FM mode).
[results.cut_prefix_style]
fg = "red"
modifier = "BOLD"

# Symlink destination display ("-> /path/target").
[results.symlink]
# Appends symlink targets to item text.
# Values: true, false | Default: false
active = true
# Symlink text styling.
style.fg = "cyan"

# 3-Tiered sort separator line (separates direct dirs, direct files, deep items when dir_first = true).
[results.tier]
# Separator style: "Top" (▔), "Underline" ( ), "Bottom" ( ), "Light" (─), "Heavy" (━), "Dashed" (╌), "None"
separator = "Underline"
# Style for the tier separator line.
style.fg = "#555555"

# Pinned / bookmarked item icon and styling.
[results.bookmark]
folder_icon = "󰮟"
file_icon = "󱀻"
icon_style.fg = "#f9e2af"

# Frecency-scored item icon and styling.
[results.frecency]
folder_icon = "󰪻"
folder_icon_style.fg = "#8999f1"
icon = "󱋢"
icon_style.fg = "#8999f1"

# Horizontal autoscroll configuration (keeps matches visible on long lines).
[results.autoscroll]
# Enables horizontal autoscroll.
# Values: true, false | Default: true
enabled = true
# Number of leading characters preserved on the left.
# Values: integers >= 0 | Default: 0
initial_preserved = 0
# Number of context characters shown around the match.
# Values: integers >= 0 | Default: 4
context = 4
# Autoscrolls all the way to the end of the line.
# Values: true, false | Default: false
end = false
# Indicator symbol displayed when text is truncated / scrolled.
# Values: string (e.g. "..", "") | Default: ".."
indicator = ""
# Indicator styling.
indicator_style.fg = "blue"

[results.border]
# type = "Rounded"


# ==============================================================================
# 5. STATUS LINE ([status])
# ==============================================================================
[status]
# Controls visibility of the status bar.
# Values: true, false | Default: true
show = true

# Indents the status bar to align with results columns.
# Values: true, false | Default: true
match_indent = true

# Custom status template format string.
# Available placeholders:
#   \r -> current cursor index (1-based)
#   \m -> total matched items count
#   \t -> total items loaded
#   \s -> available whitespace
#   \S -> increment counter appearance
# Values: string (e.g. " \m/\t") | Default: "" (automatic)
template = ""

# Status text styling.
[status.style]
fg = "green"
modifier = "ITALIC"


# ==============================================================================
# 6. PREVIEW PANEL ([preview])
# ==============================================================================
[preview]
# Controls visibility of the preview pane.
# Can be a boolean or a minimum terminal column threshold number.
# Values: true, false, integers >= 0 | Default: true
show = true

# Automatically wraps long lines in text preview.
# Values: true, false | Default: false
wrap = true

# Wraps scroll to top when reaching bottom of preview and vice versa.
# Values: true, false | Default: false
scroll_wrap = true

# Displays a vertical scrollbar in the preview pane.
# Values: true, false | Default: false
scrollbar = true

# Enables native markdown rendering with embedded Mermaid diagrams.
# Values: true, false | Default: true
markdown = true

# Native terminal image/media preview configuration (Kitty, Sixel, iTerm2).
[preview.media]
# Enables hardware-accelerated media preview.
# Values: true, false | Default: false
active = true

# Overrides terminal graphics protocol:
# Values: "kitty", "sixel", "halfblocks", "iterm2", or None (auto-detect) | Default: None
# protocol = "kitty"

# Pixel resolution for media downscaling (0 = native resolution / no downscale).
# Values: integers >= 0 (e.g. 512, 800, 1280, 1920; 0 = original) | Default: 1280
size = 0

# Image scaling and aspect ratio fit mode:
# - "fit": Scales image to fit completely inside preview pane preserving aspect ratio.
# - "crop": Fills entire preview area by cropping excess edges.
# - "scale": Stretches image to exact dimensions.
# Values: "fit", "crop", "scale" | Default: "crop"
fit = "fit"

# Initial zoom level multiplier for images.
# Values: float (e.g. 1.0, 1.5) | Default: 1.0
zoom = 1.0

# Embedded Mermaid diagram rendering inside markdown files.
[preview.diagrams]
# Enables embedded diagram rendering.
# Values: true, false | Default: true
active = true

# Renders diagrams inline using Kitty Unicode Placeholders.
# Values: true, false | Default: true
inline = true

# Diagram color theme: "auto" (detects terminal theme), "dark", "light".
# Values: "auto", "dark", "light" | Default: "auto"
theme = "auto"

# Diagram background mode: "transparent" (matches terminal background) or "solid".
# Values: "transparent", "solid" | Default: "transparent"
background = "transparent"

# Border configuration for the preview panel.
[preview.border]
# Border sides: "ALL", "LEFT", "RIGHT", "TOP", "BOTTOM", or combinations like "TOP | BOTTOM".
# Values: string | Default: "LEFT"
sides = "LEFT"
# Border line color.
color = "Darkgray"
# Title foreground color (dynamic current item name in preview border).
title_fg = "Cyan"

# Draggable preview panel layouts (cycle with SwitchPreview / Ctrl+P).
[[preview.layout]]
# Panel placement side: "right", "left", "top", "bottom".
side = "right"
# Size of the preview panel in % of available space (Golden Ratio 60/40).
percentage = 60
# Minimum columns/rows for the preview panel.
min = 20
# Maximum columns/rows for the preview panel (0 = unlimited).
max = 0
# Draggable gap width between list and preview in cells.
gap = 1

# Optional command executed to generate preview content.
# Empty string ("") activates Waymaker's high-performance native Rust reader.
# Placeholders: {1} first column/path, {} full line, {+} all selected items.
command = ""


# ==============================================================================
# 7. PREVIEW ENGINE / RUNNER ([previewer])
# ==============================================================================
[previewer]
# Delay in milliseconds before triggering preview after cursor movement (debounce).
# Prevents spawning processes during rapid arrow key scrolling.
# Values: integers >= 0 (ms) | Default: 25
debounce_ms = 200

# Retains previous preview content until the new preview is fully loaded (zero flicker).
# Values: true, false | Default: true
delay_clear = true

# Maximum number of concurrent preview child processes.
# Values: integers >= 1 | Default: 4
max_procs = 4

# When true, always re-triggers preview command even if arguments match previous item.
# Values: true, false | Default: true
always_trigger = true

# Enables lossy UTF-8 conversion for preview outputs containing binary data.
# Values: true, false | Default: false
try_lossy = false

# Strips whitespace from preview commands.
# Values: true, false | Default: false
trim_commands = false

# Hides semantic action key help in preview window.
# Values: true, false | Default: true
hide_semantic_help = true


# ==============================================================================
# 8. HEADER, FOOTER & BREADCRUMB
# ==============================================================================
# Static or dynamic header displayed at the top of the list ([header])
[header]
# content = "Press Tab to cycle sources"
match_indent = true
wrap = false
# header_lines = 0

[header.style]
fg = "Cyan"

# Static or dynamic footer displayed at the bottom of the list ([footer])
[footer]
# content = "  h/l: Nav  •  Tab: Cycle  •  Enter: Select"
match_indent = false
wrap = false
# Horizontal divider line drawn above footer: "light", "heavy", "dashed", "top", "bottom", "none"
separator = "light"
style.fg = "gray"
style.modifier = "DIM"

# Directory path breadcrumb displayed at the top ([breadcrumb])
[breadcrumb]
# Shows the current directory breadcrumb.
# Values: true, false | Default: false
show = true

# Directory separator symbol (e.g. "/", "  ", " > ").
separator = "/"

# Maximum character length for intermediate folder names (0 = no truncation).
truncate_length = 0

# Shows only the current folder name instead of full path.
current_folder_only = false

# Breadcrumb path text styling.
[breadcrumb.style]
fg = "Cyan"
modifier = "BOLD"

# Breadcrumb separator symbol styling.
[breadcrumb.separator_style]
fg = "Cyan"


# ==============================================================================
# 9. MATCHER, SORTING & FRECENCY ([matcher])
# ==============================================================================
[matcher]
# Fuzzy matching engine:
# - "frizbee": Ultra-low latency, SIMD-accelerated, optimized for fast typing.
# - "nucleo": Comprehensive fuzzy matching engine.
# Values: "frizbee", "nucleo" | Default: "nucleo"
engine = "frizbee"

# Score penalty subtracted per directory slash ('/' or '\').
# Values: integers >= 0 | Default: 0
depth_penalty = 15

# Tolerates typos and transpositions in queries >= 3 characters.
# Values: true, false | Default: false
typo_tolerance = true

# Prioritizes direct subdirectories at the top of the list before regular files.
# Values: true, false | Default: false
dir_first = true

# Sorter settings.
[matcher.sort]
# Result sorting strategy:
# - "smart": Preserves natural stream order on empty query; sorts by relevance when typing.
# - "score": Always sorts by match score.
# - "alphabetical": Sorts alphabetically.
# - "frecency": Sorts by frecency score.
# - "none": Never sorts (preserves insertion order).
# Values: "smart", "score", "alphabetical", "frecency", "none" | Default: "smart"
threshold = "smart"

# Maximum number of top matched items to re-sort by frecency / depth penalty (0 = unlimited).
# Values: integers >= 0 | Default: 1000
cap = 2000

# Frecency scoring settings (Frequency + Recency).
[matcher.frecency]
# Enables frecency score boosting for matched items.
# Values: true, false | Default: false
active = true

# Multiplier weight for frecency bonus score.
# Values: integers >= 1 | Default: 1
weight = 2

# Half-life in days for continuous exponential frecency decay.
# Values: integers >= 1 (0 = discrete legacy buckets) | Default: 7
half_life_days = 7


# ==============================================================================
# 10. STARTUP, STREAMING & DIRECTORY WALKER ([start], [walker])
# ==============================================================================
[start]
# Item delimiter for input stream.
# Values: "\n", "\0", "\\0" | Default: "\n"
input_separator = "\n"

# Delimiter used when writing accepted items to stdout.
# Values: "\n", " ", "\0" | Default: "\n"
output_separator = "\n"

# Output format template for accepted items.
# Values: "{}" (full line), "{1}" (first column), "{=}" (resolved path) | Default: None
# output_template = "{}"

# Working directory on startup. Supports environment variables and tilde.
# directory = "~/dev"

# Waits for startup command to complete before displaying the TUI.
# Values: true, false | Default: false
sync = false

# Parses ANSI color escape sequences from input lines.
# Values: true, false | Default: false
ansi = false

# Trims whitespace from input lines.
# Values: true, false | Default: false
trim = false

# Periodic reload interval in milliseconds (None = disabled).
# reload_interval = 5000

# Startup command and cyclable data sources.
[start.command]
# Primary command executed on startup. Empty string ("") uses the native directory walker.
command = ""

# Cyclable alternative data sources via @reloadnext (Tab / Ctrl+F):
# Index 0: "" -> Native AsyncWalker for local directory and files.
# Index 1: Global frecency history via `wm list --dirs`.
# Index 2: Pinned bookmarks via `wm list --bookmarks`.
additional = [
    "",
    "wm list --dirs 2>/dev/null",
    "wm list --bookmarks 2>/dev/null"
]

# Native directory walker configuration ([walker]).
[walker]
# Directory and file names ignored during traversal.
ignore = [
    ".git",
    "node_modules",
    "target",
    ".cache",
    ".rustup",
    ".cargo"
]

# Additional directories to ignore on top of default ignore list.
extra_ignore = [
    ".venv",
    "dist",
    "build"
]

# Traverses hidden files and directories (except ignored names).
# Values: true, false | Default: true
hidden = true

# Honors .gitignore rules.
# Values: true, false | Default: true
git_ignore = true

# Honors .git/info/exclude rules.
# Values: true, false | Default: true
git_exclude = true

# Honors global ~/.gitignore rules.
# Values: true, false | Default: true
git_global = true

# Maximum directory traversal depth (None = unlimited).
# Values: integers >= 1, or None | Default: None
# max_depth = 5


# ==============================================================================
# 11. COLUMNS PARSING ([columns])
# ==============================================================================
[columns]
# Strategy used to parse input lines into columns:
# - "None": Line is treated as a single column.
# - Regex string (e.g. "\\s+" splits by whitespace).
# - Array of regex strings for multi-pass splitting.
# Values: "None", regex string, array of regex strings | Default: "None"
# split = "\\s+"

# Maximum number of auto-generated columns (1 to 16).
# Values: 1 to 16 | Default: 6
max_columns = 6

# When auto-generating column names, starts indexing at 0 instead of 1.
# Values: true, false | Default: false
names_from_zero = false

# Default column used for matching and preview.
# default = "1"


# ==============================================================================
# 12. EXIT CONDITIONS ([exit])
# ==============================================================================
[exit]
# Automatically selects the item and exits if there is only one match.
# Values: true, false | Default: false
select_1 = false

# Allows returning without any item selected when Enter is pressed on empty list.
# Values: true, false | Default: false
allow_empty = false

# Aborts and exits immediately if the input stream contains zero items.
# Values: true, false | Default: true
abort_empty = true

# File path where the last pressed key is recorded upon exit.
# last_key_path = "/tmp/wm_last_key"


# ==============================================================================
# 13. ENVIRONMENT VARIABLES ([envs])
# ==============================================================================
[envs]
# Custom clipboard copy command when osc52 = false (e.g. "wl-copy", "xclip -selection clipboard").
# CLIPcmd = "wl-copy"

# Custom clipboard paste command (e.g. "wl-paste", "xclip -o").
# PASTEcmd = "wl-paste"

# Pager executable.
# PAGER = "bat"

# Editor executable.
# EDITOR = "nvim"


# ==============================================================================
# 14. CONDITIONAL FOLDER & PATH RULES ([[folder_rules]], [[rule]])
# ==============================================================================
# Folder-specific sort rules automatically applied on startup and directory navigation.
[[folder_rules]]
path = "~/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/screenshots"
sort = "CreatedReverse"

[[folder_rules]]
path = "*/Screenshots"
sort = "CreatedReverse"

# Conditional path rules to apply presets or config overrides based on active directory.
[[rule]]
path = ["$HOME", "~"]
preset = "jump"

# [[rule]]
# path = "~/dev/**"
# matcher.sort.threshold = "smart"
# matcher.frecency.active = true


# ==============================================================================
# 15. KEYBINDINGS & MACROS ([binds])
# ==============================================================================
# Syntax: "key" = "Action" or "key" = ["Action1", "Action2", ...]
# Available actions:
#   Quit(code)                 - Exit with return code (e.g. Quit(130))
#   Accept                     - Accept current selection and print to output
#   Toggle                     - Toggle multi-selection on current item
#   Up(n) / Down(n)            - Move cursor up/down by n rows
#   Pos(n)                     - Jump to position (0 = top, -1 = bottom)
#   PreviewUp(n) / Down(n)     - Scroll preview pane up/down by n lines
#   PreviewHalfPageUp / Down   - Scroll preview pane by half page
#   VScroll(n)                 - Scroll results view by n lines
#   SwitchPreview              - Cycle through configured preview layouts
#   CyclePreview               - Toggle preview panel visibility
#   ExpandPreview(n)           - Expand preview panel size by n percentage
#   ShrinkPreview(n)           - Shrink preview panel size by n percentage
#   ToggleFocus                - Switch focus between filter input and picker list
#   FocusFilter                - Focus query search input bar
#   FocusNav                   - Focus results list (NavBar)
#   ToggleParentPeek           - Toggle 3-pane parent directory peek pane
#   SortMenu                   - Open interactive sorting menu in footer
#   ChDir(path)                - Change working directory ({=} current item, .. parent)
#   Reload(cmd)                - Reload item stream with command
#   ReloadNext(idx)            - Switch to data source at index
#   Cancel                     - Clear query or cancel current selection
#   Execute(cmd)               - Run external shell command in foreground
#   ExecuteSilent(cmd)         - Run external shell command silently in background
#   Become(cmd)                - Replace Waymaker process with command
#
# Available semantic macros:
#   @reloadnext                - Cycle forward through data sources
#   @reloadprev                - Cycle backward through data sources
#   @dirs                      - Switch to global directory frecency list
#   @bookmarks                 - Switch to pinned bookmarks list
#   @bookmark                  - Toggle bookmark status on focused item
#   @yank                      - Copy item path to clipboard buffer (FM mode)
#   @cut                       - Cut item path to clipboard buffer (FM mode)
#   @paste                     - Paste items into current directory
#   @paste_into                - Paste items directly into highlighted directory
#   @undo                      - Undo last file-manager mutation
#   @redo                      - Redo last undone file-manager mutation
#
[binds]
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"ctrl-f"        = "@dirs"
"ctrl-b"        = "@bookmarks"
"*"             = "@bookmark"
"esc"           = "ToggleFocus"
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"
"ctrl-shift-j"  = "PreviewDown(5)"
"ctrl-shift-k"  = "PreviewUp(5)"
"ctrl-shift-J"  = "PreviewDown(5)"
"ctrl-shift-K"  = "PreviewUp(5)"
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]
"ctrl-e"        = "Execute(nvim {+})"
"ctrl-p"        = "SwitchPreview"
"ctrl-v"        = "@paste_into"
