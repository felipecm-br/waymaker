[tui]
percentage = 60
min = 10
max = 120

# --- UI ---
[ui]
border = { type = "Rounded" }

# Navigation mode: esc unwinds (closes boxes, clears marks and the query), then hands
# the keys to the results instead of exiting; single letters below work there.
# From navigation mode, esc or q exits and / returns to the query.
[ui.nav]
active = true
marker = "│"
hints = false # the built-in hint rows describe the file-manager keys; ? lists these

[ui.nav.binds]
# Added to the profile defaults (j/k, gt/gb, space, `,`, esc/q, ...): home-row
# paths for actions that are otherwise alt-only. y/p/P are left to the fm profile.
"esc" = "@unwind" # close help/boxes, clear marks and query, then exit
"?" = "Help"
"I" = ["FocusFilter", "QueryPos(0)"]
"+" = "ExpandPreview(2)"
"-" = "ShrinkPreview(2)"
"}" = "ExpandPreview(10)"
"{" = "ShrinkPreview(10)"
"'" = "PreviewJump"
"o" = "@open"
"O" = "@open_2"
"w" = "@print" # write to stdout
"W" = "@print_2"
"c" = "@copy"
"C" = "@copy_active"
# sort_menu = { columns = 4, show_title = true }
# default_sort = "Natural"

# Folder-specific sort rules (evaluated top-to-bottom on startup and directory changes)
# [[folder_rules]]
# path = "~/Downloads"
# sort = "ModifiedReverse"
#
# [[folder_rules]]
# path = "*/screenshots"
# sort = "CreatedReverse"

[query]
prompt_style.fg = "Gray"
history = "auto" # accepted queries, one file per preset; up on the first row recalls them

[results]
# wrap = true

[status]

[header]

[footer]
row_connection = "Full" # span list and preview, so the list can stay narrow
content = " {cyan,bold:enter} {darkgray:accept} {darkgray:│} {cyan,bold:tab} {darkgray:mark} {darkgray:│} {cyan,bold:ctrl-p} {darkgray:preview} {darkgray:│} {cyan,bold:ctrl-/} {darkgray:layout} {darkgray:│} {cyan,bold:esc} {darkgray:nav} {darkgray:│} {cyan,bold:?} {darkgray:help}"

# --- Preview ---
[preview]
show = true
wrap = true
scroll_wrap = true
markdown = true

[preview.media]
active = true

[[preview.layout]]
command = "wm preview-file {1}"


side = "right"
percentage = 60 # list 40 / preview 60
min = 30

[[preview.layout]]
side = "top"
percentage = 55
min = 5

[[preview.layout]]
side = "right"
percentage = 75
min = 5

[previewer]
always_trigger = true

# --- Misc ---
[matcher]

[columns]

[start.command]
command = ""

[start]
ansi = false # don't set to true here

# --- Walker ---
# Native directory traversal configuration.
# Directories listed here are ignored during directory scanning and jumps.
# [walker]
# ignore = [".git", ".cache", ".local", ".cargo", ".rustup", ".npm", ".npm-global", "node_modules", "target", ".venv", "venv", ".wine", ".android", ".gradle", ".m2"]
# extra_ignore = []
# hidden = true
# git_ignore = true
# git_exclude = true
# git_global = true
# max_depth = 10

[exit]

[envs]
# CLIPcmd = # Leave blank to auto-determine
# PASTEcmd = # Leave blank to auto-determine
# PAGER = # Leave blank to auto-determine
# EDITOR = # Leave blank to auto-determine

# --- Binds ---
[binds]
# Essentia
"ctrl-c" = "Abort"
"esc" = "@unwind"
"enter" = "@accept"
"alt-enter" = "@Accept"
"ctrl-enter" = "@accept_2"
"ctrl-a" = "CycleAll"
"tab" = "Toggle"  # Toggle already moves down
"shift-backtab" = "ToggleUp"

# Edit
"right" = "ForwardChar"
"left" = "BackwardChar"
"ctrl-right" = "ForwardWord"
"ctrl-left" = "BackwardWord"
"backspace" = "DeleteChar"
"ctrl-h" = "DeleteWord"
"ctrl-u" = "Cancel"
"alt-a" = "QueryPos(0)"

# Navigation
"up" = "UpOrHistory" # on the first row: the previous query (ctrl-k always moves)
"ctrl-k" = "Up"
"down" = "DownOrHistory" # while a recalled query is shown: the next one
"ctrl-n" = "HistoryNext"
"ctrl-j" = "Down"
"pagedown" = "HalfPageDown"
"pageup" = "HalfPageUp"
"shift-up" = "PreviewHalfPageUp"
"shift-down" = "PreviewHalfPageDown"
"ctrl-shift-up" = "VScroll(1)"
"ctrl-shift-down" = "VScroll(-1)"
"ctrl-shift-left" = "HScroll(-1)"
"ctrl-shift-right" = "HScroll(1)"
"alt-up" = "VScroll(1)"
"alt-down" = "VScroll(-1)"
"alt-left" = "HScroll(-1)"
"alt-right" = "HScroll(1)"
"ctrl-g" = "Pos(-1)"
"alt-1" = "Pos(0)"
"alt-0" = "Pos(-1)"

# Columns
"ctrl-." = "NextColumn"
"ctrl-shift-." = "PrevColumn"

# Preview
"shift+scrollup" = "PreviewUp"
"shift+scrolldown" = "PreviewDown"
"alt-/" = "PreviewJump"
"ctrl-p" = "SwitchPreview"
"ctrl-/" = "CyclePreview" # cycle preview layouts
"ctrl-shift-/" = "CyclePreview"
"ctrl-]" = "ExpandPreview(2)"
"alt-h" = "Help"
"alt-=" = "ExpandPreview(2)"
"alt-shift-=" = "ExpandPreview(10)"
"alt-hyphen" = "ShrinkPreview(2)"

# Reserved
"F1" = "@help"
"F2" = "@rename"
"F3" = "@search"
"F4" = "@rm"
"F5" = "@reload"
"F6" = "@cycle"
"F7" = "@build"
"F8" = "@step"
"F9" = "@break"
"F10" = "@menu"
"F11" = "@look"
"F12" = "@save"

# Programmable
"ctrl-l" = "@look" # "maximize" the preview
"ctrl-o" = "@open"
"alt-o" = "@open_2"
"ctrl-r" = "@reload"
"ctrl-shift-r" = "@reload_2"
"ctrl-shift-n" = "@next"
"ctrl-shift-p" = "@prev"
"ctrl-tab" = "@next"
"ctrl-shift-tab" = "@prev"
"ctrl-shift-backtab" = "@prev"
"ctrl-d" = "@rm"
"Delete" = "@rm"
"ctrl-s" = "@show"

"@unwind" = "Unwind"
"@accept" = "Accept"
"@Accept" = "Accept"
"@accept_2" = "Accept"
"@look" = "Execute(eval $MM_PREVIEW_COMMAND | $PAGER)"
"@open" = "Execute($EDITOR {1})"
"@open_2" = "Become($EDITOR {1})"
"@reload" = "Reload"
"@next" = "ReloadNext"
"@prev" = "ReloadPrev"
"@cycle" = "ReloadNext"
"@help" = "Help"
"@break" = "Redraw" # invalid unicode or unsupported emoji can break rendering

# Printing
"alt-p" = "@print"
"alt-shift-p" = "@print_2"
"ctrl-y" = "@copy"
"ctrl-shift-y" = "@copy_all"
"alt-y" = "@copy_active"

"@print" = "Print({-})"
"@print_2" = "Print({-!})"
"@copy" = "CopyAsync(printf '%s\n' {+1})"
"@copy_all" = "CopyAsync(printf {})"
"@copy_active" = "CopyAsync(printf '%s\n' {+!})"
