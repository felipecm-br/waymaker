[ui.nav]
active = true
bar = "Plain"
color = "Cyan"

[matcher.sort]
threshold = "smart"

[tui]
percentage = 20 # height
min = 15
max = 85

[preview]
show = true
wrap = true

[preview.border]
sides = "LEFT"
color = "Darkgray"
title_fg = "Cyan"

[previewer]
debounce_ms = 15
delay_clear = false

[[preview.layout]]
command = "ai-sound-preview {2}"
side = "right"
percentage = 55

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

[start.command]
cmd = '''
ACTIVE_SOUND=""
if [ -f "$HOME/.config/omarchy/sounds/ai-response.sound" ]; then
  ACTIVE_SOUND="$(cat "$HOME/.config/omarchy/sounds/ai-response.sound" 2>/dev/null || true)"
elif [ -f "$HOME/.config/acpd/sounds/response.sound" ]; then
  ACTIVE_SOUND="$(cat "$HOME/.config/acpd/sounds/response.sound" 2>/dev/null || true)"
fi

format_name() {
  local name="$1"
  name="${name%.*}"
  name="${name#*-}"
  name="${name//-/ }"
  name="$(echo "$name" | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2); print}')"
  echo "$name"
}

# 0. Disable / Mute option
mute_marker=""
if [ "$ACTIVE_SOUND" = "none" ] || [ "$ACTIVE_SOUND" = "off" ] || [ "$ACTIVE_SOUND" = "disabled" ]; then
  mute_marker=" 󰄴 (Active)"
fi
printf "󰝟 None / Muted (Disable Sounds)%s\tnone\n" "$mute_marker"

# 1. Curated Studio AI Sounds
for file in "$HOME/.local/share/sounds/ai"/*.wav; do
  [ -f "$file" ] || continue
  fname="${file##*/}"
  title="$(format_name "$fname")"
  marker=""
  [ "$file" = "$ACTIVE_SOUND" ] && marker=" 󰄴 (Active)"
  printf "󱚤 %s%s\t%s\n" "$title" "$marker" "$file"
done

# 2. System Freedesktop Sounds
for file in /usr/share/sounds/freedesktop/stereo/*.oga; do
  [ -f "$file" ] || continue
  fname="${file##*/}"
  title="$(format_name "$fname")"
  marker=""
  [ "$file" = "$ACTIVE_SOUND" ] && marker=" 󰄴 (Active)"
  printf "󰎁 %s%s\t%s\n" "$title" "$marker" "$file"
done

# 3. Custom User Sounds in ~/.local/share/sounds
for file in "$HOME/.local/share/sounds"/*.{wav,ogg,oga,mp3,flac,opus}; do
  [ -f "$file" ] || continue
  fname="${file##*/}"
  title="$(format_name "$fname")"
  marker=""
  [ "$file" = "$ACTIVE_SOUND" ] && marker=" 󰄴 (Active)"
  printf "󰓃 %s%s\t%s\n" "$title" "$marker" "$file"
done
'''

[query]
prompt = " 󱚤 AI Notification Sound > "
prompt_style.fg = "Cyan"
status_inline = true

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Set Sound}  •  {yellow,bold:[p / Space]} {darkgray:Replay}  •  {blue,bold:[Esc / q]} {darkgray:Quit}"
row_connection = "Full"
match_indent = false
separator = "light"

[start]
mode = "nav"

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"up" = "Up"
"down" = "Down"
"p" = "ExecuteSilent(ai-sound-play {2})"
"space" = "ExecuteSilent(ai-sound-play {2})"
"r" = "ExecuteSilent(ai-sound-play {2})"

# Nav mode binds
"nav^^j" = "Down"
"nav^^k" = "Up"
"nav^^up" = "Up"
"nav^^down" = "Down"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
"nav^^p" = "ExecuteSilent(ai-sound-play {2})"
"nav^^space" = "ExecuteSilent(ai-sound-play {2})"
"nav^^r" = "ExecuteSilent(ai-sound-play {2})"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^enter" = "Accept"
