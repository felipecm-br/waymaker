[tui]
percentage = 43

[query]
status_inline = true

[query.filter]
prompt_style.fg = "blue"
prompt_style.modifier = "BOLD"
underline = true
underline_style.fg = "#8999f1"

[query.local]
prompt = "> "
prompt_style.fg = "cyan"
underline_style.fg = "cyan"

[query.frecency]
prompt = "󱅤 "
prompt_style.fg = "#8999f1"
underline_style.fg = "#8999f1"

[query.bookmarks]
prompt = " "
prompt_style.fg = "#f9e2af"
underline_style.fg = "#f9e2af"

[ui.nav]
active = true
profile = "fm"
focus_on_start = "picker"
bar = "Plain"
color = "Darkgray"
hints = true
hints_columns = 4

[ui.parent_peek]
enabled = false

[ui.parent_peek.border]
show = false

[footer]
separator = "light"
style.fg = "gray"
style.modifier = "DIM"
match_indent = false

[matcher]
engine = "frizbee"
depth_penalty = 15
typo_tolerance = true
dir_first = true

[matcher.sort]
threshold = "smart"
cap = 2000

[matcher.frecency]
active = true
weight = 2

[results]
scroll_wrap = true
current_nav_bar = "Plain"
max = 15
reverse = false
icons = true
uncolor_current_icon = true
invert_current_icon = false
row_connection = "Full"

[results.tier]
separator = "Underline"

[results.tier.style]
fg = "#555555"

[results.symlink]
active = true
style.fg = "cyan"

[results.bookmark]
folder_icon = "󰮟"
file_icon = "󱀻"
icon_style.fg = "#f9e2af"

[results.frecency]
folder_icon = "󰪻"
folder_icon_style.fg = "#8999f1"
icon = "󱋢"
icon_style.fg = "#8999f1"

[results.current_nav_bar_style]
fg = "white"

[results.current_style]
fg = "black"
bg = "Darkgray"
modifier = "BOLD"

[results.autoscroll]
indicator = ""
indicator_style.fg = "blue"

[previewer]
debounce_ms = 200
delay_clear = true

[preview]
show = true
scrollbar = true

[preview.media]
active = true
fit = "fit"
size = 0

[preview.border]
sides = "LEFT"
color = "Darkgray"

[[preview.layout]]
side = "right"
percentage = 60

[binds]
"tab" = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab" = "@reloadprev"
"ctrl-f" = "@dirs"
"ctrl-b" = "@bookmarks"
"*" = "@bookmark"
"esc" = "ToggleFocus"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"alt-j" = "Down"
"alt-k" = "Up"
"ctrl-shift-j" = "PreviewDown(5)"
"ctrl-shift-k" = "PreviewUp(5)"
"ctrl-shift-J" = "PreviewDown(5)"
"ctrl-shift-K" = "PreviewUp(5)"
"ctrl-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]
"ctrl-e" = "Execute(nvim {+})"
"ctrl-p" = "SwitchPreview"
"ctrl-v" = "@paste_into"

[ui.nav.binds]
"tab" = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab" = "@reloadprev"
"f" = "@dirs"
"b" = "@bookmarks"
"*" = "@bookmark"
"/" = "FocusFilter"
" " = "Toggle"
"esc" = "Quit"
"q" = "Quit"
"j" = "Down"
"k" = "Up"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"alt-j" = "Down"
"alt-k" = "Up"
"J" = "PreviewDown(5)"
"K" = "PreviewUp(5)"
"shift-j" = "PreviewDown(5)"
"shift-k" = "PreviewUp(5)"
"ctrl-shift-j" = "PreviewDown(5)"
"ctrl-shift-k" = "PreviewUp(5)"
"ctrl-shift-J" = "PreviewDown(5)"
"ctrl-shift-K" = "PreviewUp(5)"
"ctrl-d" = "PreviewHalfPageDown"
"l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"right" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"left" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"backspace" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]
"e" = "Execute(nvim {+})"
"ctrl-e" = "Execute(nvim {+})"
"y" = "@yank"
"x" = "@cut"
"p" = "@paste"
"P" = "@paste_into"
"ctrl-v" = "@paste_into"
"u" = "@undo"
"ctrl-r" = "@redo"
"ctrl-p" = "SwitchPreview"
"," = "SortMenu"
"\\" = "ToggleParentPeek"

[breadcrumb]
show = true
separator = "/"
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Cyan"

[start]

[start.command]
command = ""
additional = [
    "",
    "wm list --dirs 2>/dev/null",
    "wm list --bookmarks 2>/dev/null"
]

[[folder_rules]]
path = "~/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/screenshots"
sort = "CreatedReverse"

[[folder_rules]]
path = "*/Screenshots"
sort = "CreatedReverse"
