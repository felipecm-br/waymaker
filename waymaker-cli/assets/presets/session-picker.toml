[ui.nav]
active = true
basic = true
color = "lightcyan"
marker = "│"
prompt = ""
focus_on_start = "filter"
hints = false

[start]
sort = false
ansi = true

[start.command]
command = "wm session list --icons | grep -Ev '(_lazygitrs|_popups|[[:space:]]+\\.)'"
additional = [
    "wm session list --icons | grep -Ev '(_lazygitrs|_popups|[[:space:]]+\\.)'",
    "wm session list -t --icons | grep -Ev '(_lazygitrs|_popups|[[:space:]]+\\.)'",
    "wm session list -z --icons",
]

[tui]
mouse = true
percentage = 100
max = 9999

[matcher.sort]
threshold = false

[ui.border]
sides = ""

[query]
prompt = " "
status_inline = true
show = true

[query.local]
prompt = " "
prompt_style.fg = "cyan"

[query.frecency]
prompt = " "
prompt_style.fg = "blue"

[query.bookmarks]
prompt = " "
prompt_style.fg = "yellow"

[footer]
content = " {cyan,bold:Enter} {darkgray:Connect} {darkgray:│} {cyan,bold:Tab} {darkgray:Cycle} {darkgray:│} {cyan,bold:d} {darkgray:Kill} {darkgray:│} {cyan,bold:/} {darkgray:Filter} {darkgray:│} {cyan,bold:Esc} {darkgray:Close}"
row_connection = "Full"
match_indent = false
separator = "light"

[results]
multi = false
spinner_inline = true
current_prefix = ""
unselected_prefix = "  "
row_connection = "Full"
column_spacing = 1

[results.prefix_style]
fg = "cyan"
modifier = "BOLD"

[results.style]
modifier = "DIM"

[results.current_style]
bg = "reset"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[results.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
wrap = false

[preview.border]
sides = "LEFT"
color = "Darkgray"

[[preview.layout]]
command = 'wm session preview {=}'
side = "right"
percentage = 60

[ui.nav.binds]
"tab"           = "@reloadnext"
"shift-tab"     = "@reloadprev"
"backtab"       = "@reloadprev"
"shift-backtab" = "@reloadprev"
"/"             = "FocusFilter"
"esc"           = "Quit"
"q"             = "Quit"
"d"             = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
"D"             = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
"ctrl-d"        = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
","             = []

[binds]
"tab"           = "@reloadnext"
"shift-tab"     = "@reloadprev"
"backtab"       = "@reloadprev"
"shift-backtab" = "@reloadprev"
"esc"           = "ToggleFocus"
"ctrl-c"        = "Quit"
"ctrl-d"        = [ 'ExecuteAsync(wm session kill "{=}")', "SetQuery()", "Reload" ]
","             = []

