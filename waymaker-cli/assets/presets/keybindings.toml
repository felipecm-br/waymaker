# Matchmaker / Waymaker Keybindings & Workflow HUD (`wm -o keybindings`)
# Comprehensive interactive catalog of Tmux, Shell, Frecency, and Desktop workflows.
# Tab cycles explicit filter modes: all -> tmux -> shell -> frecency -> hypr -> all.
# Enter executes the selected workflow (if runnable) or copies/notifies.

[ui.nav]
active = true
profile = "list"
focus_on_start = "filter"
bar = "Plain"
color = "Yellow"
hints = true
hints_columns = 4

[tui]
percentage = 100
max = 9999

[start]
sort = false
mode = "all"

[start.command]
command = "~/.config/tmux/keybindings-items.sh all"

[matcher.sort]
threshold = false

[query]
prompt = "> "
prompt_style.fg = "Yellow"
status_inline = true

[results]
scroll_wrap = true
max = 16
row_connection = "Full"

[columns]
split = "\t"
names = [
  "key",
  "name",
  "layer",
  { name = "id", hidden = true },
  { name = "action", hidden = true }
]

[preview]
show = true
wrap = true
scrollbar = true
markdown = true

[preview.border]
sides = "LEFT"
color = "Darkgray"
title = " Workflow Documentation "
title_fg = "Yellow"

[previewer]
debounce_ms = 25
delay_clear = false

[[preview.layout]]
command = "~/.config/tmux/keybindings-preview.sh {1} {2} {3} {4} {5}"
side = "right"
percentage = 58

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Run}  •  {magenta,bold:[Tab]} {darkgray:Filter}  •  {yellow,bold:[y]} {darkgray:Copy}  •  {blue,bold:[J/K]} {darkgray:Scroll}  •  {red,bold:[Esc]} {darkgray:Quit}"
match_indent = false
row_connection = "Full"
separator = "light"

[binds]
enter = 'ExecuteSilent(~/.config/tmux/keybindings-run.sh {5} {1} {2})'
ctrl-y = 'ExecuteSilent(printf "%s" {1} | (command -v wl-copy >/dev/null 2>&1 && wl-copy || xclip -in -selection clipboard 2>/dev/null || tmux load-buffer -))'
ctrl-v = 'ExecuteSilent(test -n "$MM_ORIGIN_PANE" && tmux send-keys -t "$MM_ORIGIN_PANE" -l -- {1})'
ctrl-j = "Down"
ctrl-k = "Up"
ctrl-shift-j = "PreviewDown(5)"
ctrl-shift-k = "PreviewUp(5)"
ctrl-J = "PreviewDown(5)"
ctrl-K = "PreviewUp(5)"
ctrl-d = "PreviewHalfPageDown"
ctrl-u = "PreviewHalfPageUp"
esc = "Quit"
ctrl-c = "Quit"

# Filter modes: Tab advances, Shift-Tab goes back.
tab = ["SetPrompt(tmux> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh tmux)", "SetMode(tmux)", "Pos(0)"]
shift-backtab = ["SetPrompt(hypr> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh hypr)", "SetMode(hypr)", "Pos(0)"]
backtab = ["SetPrompt(hypr> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh hypr)", "SetMode(hypr)", "Pos(0)"]
shift-tab = ["SetPrompt(hypr> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh hypr)", "SetMode(hypr)", "Pos(0)"]

"all^^tab" = ["SetPrompt(tmux> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh tmux)", "SetMode(tmux)", "Pos(0)"]
"all^^shift-backtab" = ["SetPrompt(hypr> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh hypr)", "SetMode(hypr)", "Pos(0)"]
"all^^backtab" = ["SetPrompt(hypr> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh hypr)", "SetMode(hypr)", "Pos(0)"]
"all^^shift-tab" = ["SetPrompt(hypr> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh hypr)", "SetMode(hypr)", "Pos(0)"]

"tmux^^tab" = ["SetPrompt(shell> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh shell)", "SetMode(shell)", "Pos(0)"]
"tmux^^shift-backtab" = ["SetPrompt(> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh all)", "SetMode(all)", "Pos(0)"]
"tmux^^backtab" = ["SetPrompt(> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh all)", "SetMode(all)", "Pos(0)"]
"tmux^^shift-tab" = ["SetPrompt(> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh all)", "SetMode(all)", "Pos(0)"]

"shell^^tab" = ["SetPrompt(frecency> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh frecency)", "SetMode(frecency)", "Pos(0)"]
"shell^^shift-backtab" = ["SetPrompt(tmux> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh tmux)", "SetMode(tmux)", "Pos(0)"]
"shell^^backtab" = ["SetPrompt(tmux> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh tmux)", "SetMode(tmux)", "Pos(0)"]
"shell^^shift-tab" = ["SetPrompt(tmux> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh tmux)", "SetMode(tmux)", "Pos(0)"]

"frecency^^tab" = ["SetPrompt(hypr> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh hypr)", "SetMode(hypr)", "Pos(0)"]
"frecency^^shift-backtab" = ["SetPrompt(shell> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh shell)", "SetMode(shell)", "Pos(0)"]
"frecency^^backtab" = ["SetPrompt(shell> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh shell)", "SetMode(shell)", "Pos(0)"]
"frecency^^shift-tab" = ["SetPrompt(shell> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh shell)", "SetMode(shell)", "Pos(0)"]

"hypr^^tab" = ["SetPrompt(> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh all)", "SetMode(all)", "Pos(0)"]
"hypr^^shift-backtab" = ["SetPrompt(frecency> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh frecency)", "SetMode(frecency)", "Pos(0)"]
"hypr^^backtab" = ["SetPrompt(frecency> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh frecency)", "SetMode(frecency)", "Pos(0)"]
"hypr^^shift-tab" = ["SetPrompt(frecency> )", "SetQuery()", "Reload(~/.config/tmux/keybindings-items.sh frecency)", "SetMode(frecency)", "Pos(0)"]

[ui.nav.binds]
enter = 'ExecuteSilent(~/.config/tmux/keybindings-run.sh {5} {1} {2})'
y = 'ExecuteSilent(printf "%s" {1} | (command -v wl-copy >/dev/null 2>&1 && wl-copy || xclip -in -selection clipboard 2>/dev/null || tmux load-buffer -))'
ctrl-y = 'ExecuteSilent(printf "%s" {1} | (command -v wl-copy >/dev/null 2>&1 && wl-copy || xclip -in -selection clipboard 2>/dev/null || tmux load-buffer -))'
ctrl-v = 'ExecuteSilent(test -n "$MM_ORIGIN_PANE" && tmux send-keys -t "$MM_ORIGIN_PANE" -l -- {1})'
esc = "Quit"
q = "Quit"
"/" = "FocusFilter"
ctrl-c = "Quit"
j = "Down"
k = "Up"
up = "Up"
down = "Down"
left = "PreviewHScroll(-6)"
right = "PreviewHScroll(6)"
ctrl-j = "Down"
ctrl-k = "Up"
ctrl-shift-j = "PreviewDown(5)"
ctrl-shift-k = "PreviewUp(5)"
ctrl-J = "PreviewDown(5)"
ctrl-K = "PreviewUp(5)"
J = "PreviewDown(5)"
K = "PreviewUp(5)"
shift-j = "PreviewDown(5)"
shift-k = "PreviewUp(5)"
d = "PreviewHalfPageDown"
ctrl-d = "PreviewHalfPageDown"
u = "PreviewHalfPageUp"
ctrl-u = "PreviewHalfPageUp"
