# Windows values for the default config. build.rs writes them over config.toml (keeping its
# comments and layout) to produce the Windows default config, so the two cannot drift apart.
# Put only keys that must differ on Windows here; each must already exist in config.toml,
# or the build fails.

[binds]
"@look" = "Execute(powershell -Command \"$env:MM_PREVIEW_COMMAND | & $env:PAGER\")"
"@open" = "Execute(powershell -Command \"& $env:EDITOR {1}\")"
"@open_2" = "Become(powershell -Command \"& $env:EDITOR {1}\")"
"@copy" = "CopyAsync(Write-Output {+1})"
"@copy_all" = "CopyAsync(Write-Output {})"
"@copy_active" = "CopyAsync(Write-Output {+!})"
