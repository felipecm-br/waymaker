version: 2
updates:
  # Grouped so a week of crate bumps arrives as one PR, not dozens.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # The Rust toolchain is pinned in rust-toolchain.toml and must be bumped
    # together with these pins by hand.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
