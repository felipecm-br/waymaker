name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS runs in macos.yml: its runners often take over 15 minutes to start, which cancelled
  # whole CI runs; a macOS result now never holds up this one.
  test:
    runs-on: ubuntu-latest
    # A hung test should fail with its log kept, not run until cancelled.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --workspace --locked
      - name: Check experimental features
        run: cargo check -p waymaker-cli -F experimental --locked

  # Releases ship a Windows binary, so keep it compiling warning-free and run the
  # platform-independent tests. The full suite has not been made to pass on Windows yet.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Unit tests of every crate. The end-to-end tests (golden, pty) drive a Unix pty.
      - name: Test
        run: cargo test --workspace --lib --bins --tests --locked --no-fail-fast

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --all --check

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Relative links and anchors in Markdown
        run: python3 scripts/check_links.py

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Line coverage is ~75% (the pty and golden-frame tests drive the render loop);
      # the floor catches large drops without failing on noise. Raise it as coverage improves.
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 72 \
            | tee coverage.txt
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Each fuzz target (fuzz/README.md) runs briefly on every push; a crash fails the job and
  # its input is uploaded. cargo-fuzz needs nightly; rust-toolchain.toml pins stable, hence
  # `+nightly`.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Fuzz
        run: |
          # Build against the dependency versions the workspace is tested with.
          cp Cargo.lock fuzz/Cargo.lock
          # The installed cargo-fuzz is a musl build and defaults to its own target, where
          # the address sanitizer cannot link; build for the runner's glibc host instead.
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run --target "$host" "$target" -- -max_total_time=30
            echo "::endgroup::"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Advisories, licenses, banned crates and allowed sources; see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets -F waymaker-cli/experimental --locked -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (waymaker-lib without default features)
        run: cargo clippy -p waymaker-lib --all-targets --no-default-features --locked -- -D warnings
      - name: Clippy (wm without diagram-images)
        run: cargo clippy -p waymaker-cli --all-targets --no-default-features --locked -- -D warnings

  # Old vs new binary on the same 500k-line input: `wm -f` output must be identical, peak RSS
  # may grow at most 10%, and only a large slowdown fails (see scripts/regress.py).
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Same settings for both builds; thin LTO keeps two release builds affordable.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build new (this commit)
        run: |
          cargo build --release -p waymaker-cli --locked
          cp target/release/wm "$RUNNER_TEMP/wm-new"
      - name: Build old (${{ env.BASE }})
        id: base
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cargo build --release -p waymaker-cli --locked \
            --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --target-dir target
          cp target/release/wm "$RUNNER_TEMP/wm-old"
      - name: Compare
        if: steps.base.outputs.skip != 'true'
        # An explicit bash shell runs with pipefail, so the script's exit status survives `tee`.
        shell: bash
        run: |
          python3 scripts/regress.py "$RUNNER_TEMP/wm-old" "$RUNNER_TEMP/wm-new" --markdown \
            --old-config "$RUNNER_TEMP/base/waymaker-cli/assets/config.toml" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --release -p waymaker-cli --locked
      - name: Run filter and streaming frametime benchmarks
        run: |
          {
            echo "## Headless Filter Benchmark"
            python3 scripts/bench_filter.py --sizes 10000 100000 --runs 3 --markdown
            echo "## Interactive Streaming Frametime (100k items)"
            echo '```'
            seq 1 100000 | awk '{print "src/module_" $1 % 977 "/file_" $1 ".rs"}' \
              | ./target/release/wm --config waymaker-cli/assets/config.toml --benchmark-input mod97
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
