name: Release waymaker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🐧 Linux x86_64 (musl - fully static standalone binary)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # 🐧 Linux ARM64 (musl - fully static standalone binary)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # 🍎 macOS Apple Silicon (M1/M2/M3/M4)
          - target: aarch64-apple-darwin
            os: macos-latest
          # 🍎 macOS Intel (x86_64), cross-compiled on Apple Silicon: the
          # macos-13 Intel runner image has been retired.
          - target: x86_64-apple-darwin
            os: macos-latest
          # 🪟 Windows 64-bit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # Signed build provenance (`gh attestation verify <archive> --repo felipecm-br/waymaker`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Build and Upload Binary Assets
        id: wm
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: wm
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          # .tar.gz everywhere except Windows (.zip)
          subject-path: ${{ steps.wm.outputs.tar || steps.wm.outputs.zip }}
