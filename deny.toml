# cargo-deny: advisories, licenses, banned crates and allowed sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, but only direct dependencies fail CI:
# transitive ones can only be fixed upstream.
unmaintained = "workspace"
ignore = []

[licenses]
# Every license here is compatible with distributing waymaker under
# AGPL-3.0-or-later.
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# The tree pulls several majors of a few crates (bitflags, windows-sys, ...);
# report them without failing CI.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The nucleo fork carries waymaker's matcher changes; see [patch.crates-io].
allow-git = ["https://github.com/Squirreljetpack/nucleo"]
